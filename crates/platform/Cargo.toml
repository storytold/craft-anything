[package]
name = "craft-anything-platform"
description = "Native platform services for Craft Anything: owned processes, capture, sandbox, engine store"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
craft-anything-evidence = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
process-wrap = { version = "10", default-features = false, features = ["std", "process-group", "process-session", "job-object", "kill-on-drop", "creation-flags"] }
# Process capture under a pseudo-terminal (safe public APIs; we write no unsafe).
portable-pty = "0.9"
vt100 = "0.16"

# Window screenshots of a running program (safe API). Windows and macOS: on Linux it needs
# PipeWire, Wayland/GBM, XCB and clang to build (ROADMAP R2.4).
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
xcap = "0.9"

# Linux: the X protocol in Rust (no C libraries; already in the tree through winit and arboard).
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", default-features = false, features = ["image"] }

# Whether Screen Recording is allowed (a safe call; xcap uses the same crate).
[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-graphics = "0.3"
# Asking a pictured app to quit before it's killed (safe calls; xcap already brings this crate).
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "libc", "NSRunningApplication"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", default-features = false, features = ["signal", "process"] }

[target.'cfg(windows)'.dependencies]
# Only for the creation-flags type process-wrap takes (already in the tree through it).
windows = { version = "0.62", default-features = false, features = ["Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"
