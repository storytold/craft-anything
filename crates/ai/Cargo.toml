[package]
name = "craft-anything-ai"
description = "AI backends, the agent loop and crews for Craft Anything"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
schemars = { workspace = true }
craft-anything-evidence = { workspace = true }
craft-anything-engine = { workspace = true }
craft-anything-engines = { workspace = true }
craft-anything-formats = { workspace = true }
craft-anything-platform = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
regex = { workspace = true }
# Already used transitively; parse explicit language tags with ICU, not an app-local grammar.
icu_locale_core = "2"
toml = { workspace = true }
ureq = "3"
# Pictures are sent to models as base64 (the same version the engine crate uses).
base64 = "0.22"
dirs = "6"
# The locked tempfile implementation supplies a no-replace rename when hard links are unavailable.
tempfile = "3"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", default-features = false, features = ["async-secret-service", "async-io", "crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }

[dev-dependencies]
craft-anything-testkit = { workspace = true }
