# The gate runs the tests on Ubuntu, where `cfg(windows)` code is not compiled at all, so the
# Windows-only tests (search paths, consoles, Job Objects) only ever ran on a contributor's own
# machine. This job runs them on a Windows runner too, so a change that breaks Windows fails here
# instead of in a release.
#
# It runs the platform crate's units, where those tests live, and the `ai` crate's too: an earlier
# run said `cli_agents::unfinished::tests::a_killed_turns_session_is_deleted_by_the_next_sweep`
# hung on a Windows host, but the whole suite passed in seconds on Windows 11. Each step has its
# own timeout, so a hang fails that step rather than spending the job's budget; the `ai` step's is
# longer because a cold cache rebuilds its dependencies with a different feature set (about ten
# minutes of compiling on a fresh runner) before a second of tests runs.
name: Windows tests

# Every PR and every push to main: a Windows-only regression can arrive in any crate that touches
# platform code, and a daily run would report it only after it has been merged.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a PR branch cancels its older run; every push to main runs to the end.
concurrency:
  group: windows-tests-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows-tests:
    runs-on: windows-latest
    # The tests themselves take seconds; a cold build of the engine they sit on takes minutes.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          # The build steps run PR code; nothing here needs the checkout's token afterwards.
          persist-credentials: false
      # The runner image has the MSVC tools a Windows Rust build links against.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-tests
      - name: Windows-only unit tests
        # Never let a hung test hold the runner for the job's whole budget.
        timeout-minutes: 10
        run: cargo test -p craft-anything-platform --lib
      # Its dependencies resolve with different features than the platform crate's, so a cold cache
      # compiles a lot of them again here: about ten minutes before the suite's few seconds.
      - name: AI crate unit tests
        timeout-minutes: 25
        run: cargo test -p craft-anything-ai --lib
